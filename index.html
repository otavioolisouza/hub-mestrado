<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub do Mestrado</title>
<meta name="description" content="Disciplinas, leituras, fichamentos e dissertação em um só lugar.">
<meta name="theme-color" content="#1E4D42">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mestrado">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<!-- Versões fixadas de propósito: uma atualização das bibliotecas só passa a
     rodar no hub depois de revisada. Veja o GUIA.md antes de trocar. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
</head>
<body>
  <div id="root"><div class="loading">Carregando…</div></div>
  <div id="modal"></div>
  <div id="drop-overlay" class="drop-overlay" hidden><div><b>Solte para depositar</b><span>Os textos serão analisados e cadastrados automaticamente.</span></div></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <input type="file" id="file-picker" accept=".pdf,.doc,.docx,.odt,.epub,.ppt,.pptx" multiple hidden>
  <script src="config.js"></script>
  <script src="nucleo.js"></script>
  <script src="app.js"></script>
</body>
</html>
